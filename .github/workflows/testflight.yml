name: TestFlight

# Her commit'te ÇALIŞMAZ. Her yükleme bir build numarası harcar, App Store Connect'te
# işlenmeyi bekler ve tüm iç test kullanıcılarına bildirim gider — gürültü yapar.
# Sürüm etiketi atınca ya da Actions sekmesinden elle çalışır.
# Her push'ta istersen: aşağıya `branches: [main]` ekle.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build numarası (boşsa iş akışı sayacı kullanılır)"
        required: false
        type: string
  push:
    tags: ["v*"]

# İki yükleme aynı anda koşarsa aynı build numarasını üretip biri reddedilir.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Derle ve TestFlight'a yükle
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SCHEME: ShotSenseApp
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
      DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # Eksik secret'ı 40 dakikalık bir derlemenin SONUNDA öğrenmek pahalı; başta bak.
      - name: Secret'ları doğrula
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 \
                      DIST_CERT_P12_BASE64 DIST_CERT_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Eksik secret:$missing — kurulum: docs/09-testflight.md"
            exit 1
          fi

      - name: Xcode sürümünü seç
        run: |
          latest=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version

      # Anahtar diske yazılır çünkü xcodebuild dosya yolu ister. Runner iş bitince
      # imha edildiği için kalıcı bir iz kalmaz; yine de izinler daraltılır.
      - name: App Store Connect API anahtarını yerleştir
        run: |
          mkdir -p "$HOME/private_keys"
          chmod 700 "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode \
            > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      # Sertifika, varsayılan giriş anahtarlığına DEĞİL geçici bir anahtarlığa girer:
      # runner paylaşımlı bir imaj, kalıcı anahtarlığı kirletmek istemeyiz.
      - name: Dağıtım sertifikasını geçici anahtarlığa al
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12"

          # Bu satır olmadan codesign her imzalamada GUI parola sorar ve iş asılı kalır.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null

          # Arama listesine EKLE (üzerine yazma): sistem anahtarlığı düşerse kök
          # sertifikalar kaybolur ve imzalama "unknown authority" ile düşer.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed 's/[" ]//g')

          echo "Anahtarlıktaki imzalama kimlikleri:"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed 's/[0-9A-F]\{40\}/<hash>/'

      - name: Build numarasını belirle
        run: |
          number="${{ inputs.build_number }}"
          if [ -z "$number" ]; then number="$GITHUB_RUN_NUMBER"; fi
          echo "BUILD_NUMBER=$number" >> "$GITHUB_ENV"
          echo "Build numarası: $number"

      - name: Projeyi üret
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Arşivle
        run: |
          xcodebuild archive \
            -project ShotSense.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ShotSense.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            -quiet

      # destination=upload: dışa aktarma ve yükleme tek adımda, ayrıca altool'a
      # (Apple tarafından kullanımdan kaldırıldı) hiç ihtiyaç duyulmaz.
      - name: TestFlight'a yükle
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <!-- false: sürüm/build numarasını BİZ yönetiyoruz (yukarıdaki adım). -->
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ShotSense.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # Kilitlenme raporlarını okunur kılan tek şey bunlar; arşivle birlikte silinirse
      # TestFlight'tan gelen çökme izleri anlamsız adres listesine döner.
      - name: dSYM'leri sakla
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dsyms-build-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/ShotSense.xcarchive/dSYMs
          if-no-files-found: warn
          retention-days: 90

      - name: Sırları temizle
        if: always()
        run: |
          rm -rf "$HOME/private_keys"
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
